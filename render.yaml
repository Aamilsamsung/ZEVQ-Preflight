# PROPOSED STAGING ONLY. Applying creates paid database + worker resources.
# Requires explicit spending approval. Public launch/registration stays disabled.
services:
  - type: web
    name: zevq-preflight-staging
    runtime: python
    region: singapore
    branch: implementation/secure-preflight
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt && python -m pip check
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PREFLIGHT_MODE
        value: staging
      - key: STAGING_PASSWORD
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zevq-preflight-staging-db
          property: connectionString
  - type: worker
    name: zevq-preflight-staging-worker
    runtime: python
    region: singapore
    branch: implementation/secure-preflight
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PREFLIGHT_MODE
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: zevq-preflight-staging-db
          property: connectionString
databases:
  - name: zevq-preflight-staging-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    ipAllowList: []
