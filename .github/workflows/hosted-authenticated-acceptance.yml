name: Authenticated hosted browser acceptance
on:
  push:
    branches: [implementation/public-onboarding-20261029]
    paths:
      - .github/workflows/hosted-authenticated-acceptance.yml
      - scripts/browser_fixture.cjs
      - BROWSER_RUN_REQUEST.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflight-authenticated-browser
  cancel-in-progress: false
jobs:
  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate safe synthetic identity prerequisite
        env:
          PREFLIGHT_HOSTED_BROWSER_FIXTURE: ${{ secrets.PREFLIGHT_HOSTED_BROWSER_FIXTURE }}
        run: |
          node scripts/test_browser_fixture.cjs
          node - <<'JS'
          const fs = require('fs');
          const { readFixture } = require('./scripts/browser_fixture.cjs');
          const f = readFixture(process.env.PREFLIGHT_HOSTED_BROWSER_FIXTURE);
          fs.mkdirSync('artifacts/hosted-isolation', { recursive: true, mode: 0o700 });
          fs.writeFileSync('artifacts/hosted-isolation/credentials.json', JSON.stringify({ accounts: [{ email: f.email, password: f.password }], orgs: [{ id: f.organization_id }] }), { mode: 0o600 });
          fs.writeFileSync('artifacts/hosted-isolation/review-results.json', JSON.stringify([{ feature: 'Controlled breaking-change scan completes', evidence: { scan_id: f.review_scan_id } }]), { mode: 0o600 });
          JS
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/auth-browser" playwright@1.62.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/auth-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify guarded current source head
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: 'implementation/public-onboarding-20261029' });
            if (branch.data.commit.sha !== context.sha) core.setFailed('Concurrent branch activity detected; do not log in or mutate sessions.');
      - name: Test actual hosted authenticated workspace
        env:
          NODE_PATH: ${{ runner.temp }}/auth-browser/node_modules
          PREFLIGHT_HOSTED_QA: '1'
          PREFLIGHT_QA_SKIP_SCREENSHOTS: '1'
          PREFLIGHT_QA_SAFE_ARTIFACT: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hosted_browser_qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-hosted-browser-results
          path: artifacts/hosted-browser/results.json
