name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: preflight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked dependencies
        run: pip install -r requirements.txt
      - name: Check installed dependency consistency
        run: pip check
      - name: SQLite regression suite
        run: python -m pytest -q --junitxml=artifacts/sqlite.xml
      - name: PostgreSQL migrations and API boundaries
        env:
          DATABASE_URL: postgresql+psycopg://preflight:ci-only-password@localhost:5432/preflight_test
          TEST_DATABASE_URL: postgresql+psycopg://preflight:ci-only-password@localhost:5432/preflight_test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m pytest tests/test_api.py tests/test_account_controls.py tests/test_finding_reviews.py tests/test_comparisons.py tests/test_postgres_bootstrap.py -q --junitxml=artifacts/postgres.xml
      - name: Synthetic PostgreSQL backup and restore drill
        env:
          DATABASE_URL: postgresql+psycopg://preflight:ci-only-password@localhost:5432/preflight_test
          PREFLIGHT_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python -m scripts.backup_restore_check seed
          docker exec "$PREFLIGHT_TEST_CONTAINER" pg_dump -U preflight -d preflight_test -Fc --no-owner --no-privileges > "$RUNNER_TEMP/preflight-ci-backup.dump"
          docker exec "$PREFLIGHT_TEST_CONTAINER" createdb -U preflight preflight_restore
          docker exec -i "$PREFLIGHT_TEST_CONTAINER" pg_restore -U preflight -d preflight_restore --no-owner --no-privileges --exit-on-error < "$RUNNER_TEMP/preflight-ci-backup.dump"
          DATABASE_URL=postgresql+psycopg://preflight:ci-only-password@localhost:5432/preflight_restore python -m scripts.backup_restore_check verify
      - name: Install browser QA tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/preflight-browser" playwright@1.62.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/preflight-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser workflow against local API and worker
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_local_qa
          NODE_PATH="$RUNNER_TEMP/preflight-browser/node_modules" QA_START_SERVICES=1 node scripts/browser-qa.cjs
          NODE_PATH="$RUNNER_TEMP/preflight-browser/node_modules" node scripts/independent_browser_checks.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            artifacts/*.xml
            artifacts/restore-results.json
            artifacts/browser-qa-results.json
            artifacts/independent-audit/frontend-results.json
            artifacts/qa-desktop*.png
            artifacts/qa-mobile.png
            artifacts/qa-tablet.png
